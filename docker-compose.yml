services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo18:
    image: odoo:18.0
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    command: >
      sh -c "
      if [ ! -f /var/lib/odoo/.db_initialized ]; then
        echo 'Initializing database';
        odoo -d odoo_db --db_user=odoo --db_password=odoo --db_host=db -i base --stop-after-init;
        touch /var/lib/odoo/.db_initialized;
      fi;
      odoo -d odoo_db --db_user=odoo --db_password=odoo --db_host=db --proxy-mode
      "

  nginx:
    image: nginx:latest
    depends_on:
      - odoo18
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  odoo-web-data:
  odoo-db-data:
