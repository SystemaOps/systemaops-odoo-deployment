global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["localhost:9187"]

  - job_name: odoo
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8069"]
