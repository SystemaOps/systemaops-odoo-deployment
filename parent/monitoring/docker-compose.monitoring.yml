version: "3.8"

# Customer-VM monitoring stack. Started by the Phase 2 deploy script.
# Node exporter and Prometheus bind to host ports 9100 and 9090 so the
# central SystemaOps Prometheus can scrape this VM directly.

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:?set DB_USER}:${DB_PASSWORD:?set DB_PASSWORD}@${DB_HOST:?set DB_HOST}:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable"
    networks:
      - default
      - odoo-net

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  prometheus-data:

networks:
  default:
  odoo-net:
    external: true
    name: ${ODOO_NETWORK:?set ODOO_NETWORK to the odoo compose network}
