name: SystemaOps Odoo VM Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Unique deployment identifier (matches Phase 1 artifact)"
        required: true
        type: string
      deployment_config:
        description: "JSON string with all customer deployment parameters (incl. VM details)"
        required: true
        type: string
      central_register_url:
        description: "Optional SystemaOps central monitoring registration URL"
        required: false
        type: string
      source_run_id:
        description: "Phase 1 run id that produced the deployment artifact"
        required: false
        type: string

env:
  DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to Customer VM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse VM configuration
        id: vm
        run: |
          CONFIG='${{ github.event.inputs.deployment_config }}'
          echo "VM_HOST=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("vm_host",""))')" >> "$GITHUB_OUTPUT"
          echo "VM_SSH_USER=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("vm_ssh_user",""))')" >> "$GITHUB_OUTPUT"
          echo "VM_SSH_PORT=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("vm_ssh_port",22))')" >> "$GITHUB_OUTPUT"
          echo "VM_PROVIDER=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("vm_provider",""))')" >> "$GITHUB_OUTPUT"
          echo "SSH_KEY_SECRET=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys,re;print(json.load(sys.stdin).get("ssh_key_secret",""))')" >> "$GITHUB_OUTPUT"
          echo "BASTION_HOST=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("bastion_host",""))')" >> "$GITHUB_OUTPUT"
          echo "BASTION_SSH_USER=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("bastion_ssh_user",""))')" >> "$GITHUB_OUTPUT"
          echo "BASTION_SSH_PORT=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("bastion_ssh_port",22))')" >> "$GITHUB_OUTPUT"

      - name: Download Phase 1 artifact (optional)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
          ARTIFACT_NAME: deployment-${{ github.event.inputs.deployment_id }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            echo "Downloading Phase 1 artifact from run $SOURCE_RUN_ID..."
            for i in 1 2 3; do
              if gh run download "$SOURCE_RUN_ID" \
                  -R "${{ github.repository }}" \
                  -n "$ARTIFACT_NAME" \
                  -D artifact; then
                echo "Artifact downloaded successfully"
                break
              fi
              [ "$i" = "3" ] && { echo "Artifact download failed after 3 attempts"; exit 1; }
              sleep 3
            done
          else
            echo "No source_run_id provided; skipping artifact download."
          fi

      - name: Locate and stage workspace
        run: |
          set -euo pipefail
          if [[ -f "artifact/deployment_summary.json" ]]; then
            # Artifact was downloaded, use it
            SUMMARY="artifact/deployment_summary.json"
          else
            # No artifact downloaded, generate workspace from deployment_config
            echo "Generating workspace from deployment_config..."
            mkdir -p artifact
            echo '${{ github.event.inputs.deployment_config }}' > artifact/deployment_config.json
            # Parse deployment_config to extract key fields
            CONFIG='${{ github.event.inputs.deployment_config }}'
            echo "$CONFIG" | python3 -c "
import json, sys, os, re, base64
config = json.load(sys.stdin)
# Write deployment_summary.json
summary = {
    'deployment_id': os.environ.get('DEPLOYMENT_ID', ''),
    'company_name': config.get('company_name', ''),
    'database_name': config.get('database_name', ''),
    'industry': config.get('industry', ''),
    'timezone': config.get('timezone', 'UTC'),
    'number_of_users': int(config.get('number_of_users', 10)),
    'module_count': len(config.get('selected_modules', [])),
    'status': 'package_prepared',
    'created_at': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
    'odoo_port': int(config.get('odoo_port', 8069)),
    'grafana_port': int(config.get('grafana_port', 3002)),
    'admin_name': config.get('admin_name', 'admin'),
    'domain': config.get('domain', ''),
    'container_prefix': re.sub(r'[^a-zA-Z0-9]', '', config.get('company_name', '').lower())[:12],
    'vm_provider': config.get('vm_provider', ''),
    'vm_host': config.get('vm_host', ''),
    'vm_ssh_user': config.get('vm_ssh_user', ''),
    'vm_ssh_port': int(config.get('vm_ssh_port', 22) or 22),
    'vm_domain': config.get('vm_domain', ''),
    'ssh_key_secret': config.get('ssh_key_secret', ''),
    'offsite_target': config.get('offsite_target', ''),
    'company_logo': config.get('company_logo', ''),
    'owner_photo': config.get('owner_photo', ''),
}
with open('artifact/deployment_summary.json', 'w') as f:
    json.dump(summary, f, indent=2)
"
            SUMMARY="artifact/deployment_summary.json"
          fi
          [[ -n "$SUMMARY" ]] || { echo "deployment_summary.json not found"; exit 1; }
          WORKSPACE_DIR="$(dirname "$SUMMARY")"
          echo "WORKSPACE_DIR=$WORKSPACE_DIR" >> "$GITHUB_ENV"
          echo "Using workspace: $WORKSPACE_DIR"
          test -f "$WORKSPACE_DIR/deployment_summary.json"

      - name: Write branding assets
        run: |
          set -euo pipefail
          CONFIG='${{ github.event.inputs.deployment_config }}'
          echo "$CONFIG" | python3 -c "
import json, sys, base64, os
config = json.load(sys.stdin)
branding_dir = 'artifact/branding'
os.makedirs(branding_dir, exist_ok=True)
if config.get('company_logo'):
    data = config['company_logo'].split(',')[1] if ',' in config['company_logo'] else config['company_logo']
    with open(os.path.join(branding_dir, 'company_logo.png'), 'wb') as f:
        f.write(base64.b64decode(data))
if config.get('owner_photo'):
    data = config['owner_photo'].split(',')[1] if ',' in config['owner_photo'] else config['owner_photo']
    with open(os.path.join(branding_dir, 'owner_photo.png'), 'wb') as f:
        f.write(base64.b64decode(data))
"

      - name: Set up SSH key
        env:
          SSH_KEY_SECRET: ${{ steps.vm.outputs.SSH_KEY_SECRET }}
          SSH_KEY_VALUE: ${{ secrets[steps.vm.outputs.SSH_KEY_SECRET] }}
        run: |
          if [[ -z "$SSH_KEY_SECRET" ]]; then
            echo "No SSH key secret configured; skipping VM deployment."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY_VALUE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "KEY_BYTES=$(wc -c < ~/.ssh/id_deploy)"
          echo "KEY_TAIL=$(tail -c 30 ~/.ssh/id_deploy | od -An -c | tr -d '\n')"
          if ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/keypub 2>/tmp/keyerr; then
            echo "KEY_PARSE_OK"
            echo "KEY_FP=$(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2}')"
          else
            echo "KEY_PARSE_FAIL"
            cat /tmp/keyerr
          fi
          echo "SSH_READY=true" >> "$GITHUB_ENV"

      - name: Transfer workspace to VM
        if: env.SSH_READY == 'true'
        env:
          VM_HOST: ${{ steps.vm.outputs.VM_HOST }}
          VM_SSH_USER: ${{ steps.vm.outputs.VM_SSH_USER }}
          VM_SSH_PORT: ${{ steps.vm.outputs.VM_SSH_PORT }}
          BASTION_HOST: ${{ steps.vm.outputs.BASTION_HOST }}
          BASTION_SSH_USER: ${{ steps.vm.outputs.BASTION_SSH_USER }}
          BASTION_SSH_PORT: ${{ steps.vm.outputs.BASTION_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ -n "$VM_HOST" ]] || { echo "vm_host missing in deployment_config"; exit 1; }
          REMOTE_DIR="/opt/systemaops/${DEPLOYMENT_ID}"
          if [[ -n "$BASTION_HOST" ]]; then
            SSH_OPTS="-i ~/.ssh/id_deploy -p $VM_SSH_PORT -o StrictHostKeyChecking=accept-new -J ${BASTION_SSH_USER}@${BASTION_HOST}:${BASTION_SSH_PORT}"
            SSH_OPTS_B="-i ~/.ssh/id_deploy -P $VM_SSH_PORT -o StrictHostKeyChecking=accept-new -J ${BASTION_SSH_USER}@${BASTION_HOST}:${BASTION_SSH_PORT}"
          else
            SSH_OPTS="-i ~/.ssh/id_deploy -p $VM_SSH_PORT -o StrictHostKeyChecking=accept-new"
            SSH_OPTS_B="-i ~/.ssh/id_deploy -P $VM_SSH_PORT -o StrictHostKeyChecking=accept-new"
          fi
          for i in 1 2 3; do
            if ssh $SSH_OPTS "${VM_SSH_USER}@${VM_HOST}" \
                "if command -v sudo >/dev/null 2>&1 && [ \"\$(id -u)\" -ne 0 ]; then S='sudo '; else S=''; fi; \${S}mkdir -p '$REMOTE_DIR' && \${S}chown \$(id -u):\$(id -g) '$REMOTE_DIR'"; then
              break
            fi
            [ "$i" = "3" ] && { echo "SSH connection to ${VM_HOST} failed after 3 attempts"; exit 1; }
            sleep 3
          done
          tar -czf /tmp/workspace.tar.gz -C "$WORKSPACE_DIR" .
          for i in 1 2 3; do
            if scp $SSH_OPTS_B /tmp/workspace.tar.gz "${VM_SSH_USER}@${VM_HOST}:/tmp/${DEPLOYMENT_ID}.tar.gz" \
              && scp $SSH_OPTS_B \
                scripts/deploy/remote_deploy.sh "${VM_SSH_USER}@${VM_HOST}:/tmp/remote_deploy.sh"; then
              break
            fi
            [ "$i" = "3" ] && { echo "Transfer to ${VM_HOST} failed after 3 attempts"; exit 1; }
            sleep 3
          done
          ssh $SSH_OPTS "${VM_SSH_USER}@${VM_HOST}" \
            "if command -v sudo >/dev/null 2>&1 && [ \"\$(id -u)\" -ne 0 ]; then S='sudo '; else S=''; fi; \${S}tar -xzf /tmp/${DEPLOYMENT_ID}.tar.gz -C '$REMOTE_DIR' && \${S}rm -f /tmp/${DEPLOYMENT_ID}.tar.gz"

      - name: Run remote deployment
        if: env.SSH_READY == 'true'
        env:
          VM_HOST: ${{ steps.vm.outputs.VM_HOST }}
          VM_SSH_USER: ${{ steps.vm.outputs.VM_SSH_USER }}
          VM_SSH_PORT: ${{ steps.vm.outputs.VM_SSH_PORT }}
          BASTION_HOST: ${{ steps.vm.outputs.BASTION_HOST }}
          BASTION_SSH_USER: ${{ steps.vm.outputs.BASTION_SSH_USER }}
          BASTION_SSH_PORT: ${{ steps.vm.outputs.BASTION_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/opt/systemaops/${DEPLOYMENT_ID}"
          if [[ -n "$BASTION_HOST" ]]; then
            ssh -i ~/.ssh/id_deploy -p "$VM_SSH_PORT" -o StrictHostKeyChecking=accept-new \
              -J "${BASTION_SSH_USER}@${BASTION_HOST}:${BASTION_SSH_PORT}" \
              "${VM_SSH_USER}@${VM_HOST}" \
              "bash /tmp/remote_deploy.sh '$REMOTE_DIR'"
          else
            ssh -i ~/.ssh/id_deploy -p "$VM_SSH_PORT" -o StrictHostKeyChecking=accept-new \
              "${VM_SSH_USER}@${VM_HOST}" \
              "bash /tmp/remote_deploy.sh '$REMOTE_DIR'"
          fi

      - name: Register VM with central monitoring
        if: >-
          env.SSH_READY == 'true' &&
          github.event.inputs.central_register_url != ''
        continue-on-error: true
        env:
          VM_HOST: ${{ steps.vm.outputs.VM_HOST }}
          VM_SSH_USER: ${{ steps.vm.outputs.VM_SSH_USER }}
          VM_SSH_PORT: ${{ steps.vm.outputs.VM_SSH_PORT }}
          VM_PROVIDER: ${{ steps.vm.outputs.VM_PROVIDER }}
          CENTRAL_REGISTER_URL: ${{ github.event.inputs.central_register_url }}
          CENTRAL_REGISTER_TOKEN: ${{ secrets.CENTRAL_REGISTER_TOKEN }}
        run: |
          set -euo pipefail
          # Registration is performed from the deployment VM so the central
          # URL is resolved from within the customer's network.
          for i in 1 2 3; do
            if ssh -i ~/.ssh/id_deploy -p "${VM_SSH_PORT}" -o StrictHostKeyChecking=accept-new "${VM_SSH_USER}@${VM_HOST}" \
              "curl -fsS -X POST '${CENTRAL_REGISTER_URL}/api/monitoring/register' \
                 -H 'X-Register-Token: ${CENTRAL_REGISTER_TOKEN}' \
                 --data-urlencode 'deployment_id=${DEPLOYMENT_ID}' \
                 --data-urlencode 'host=${VM_HOST}' \
                 --data-urlencode 'labels=provider=${VM_PROVIDER:-}'"; then
              echo "Registered ${DEPLOYMENT_ID} (${VM_HOST}) with central monitoring."
              exit 0
            fi
            sleep 3
          done
          echo "WARNING: central monitoring registration failed; deploy still succeeded."
