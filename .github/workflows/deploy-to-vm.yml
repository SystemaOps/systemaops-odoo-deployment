name: SystemaOps Odoo VM Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Unique deployment identifier (matches Phase 1 artifact)"
        required: true
        type: string
      deployment_config:
        description: "JSON string with all customer deployment parameters (incl. VM details)"
        required: true
        type: string

env:
  DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to Customer VM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse VM configuration
        id: vm
        run: |
          CONFIG='${{ github.event.inputs.deployment_config }}'
          echo "VM_HOST=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("vm_host",""))')" >> "$GITHUB_OUTPUT"
          echo "VM_SSH_USER=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("vm_ssh_user",""))')" >> "$GITHUB_OUTPUT"
          echo "VM_SSH_PORT=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("vm_ssh_port",22))')" >> "$GITHUB_OUTPUT"
          echo "SSH_KEY_SECRET=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys,re;print(json.load(sys.stdin).get("ssh_key_secret",""))')" >> "$GITHUB_OUTPUT"

      - name: Download Phase 1 artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-${{ github.event.inputs.deployment_id }}
          path: artifact

      - name: Locate and stage workspace
        run: |
          WORKSPACE_DIR="artifact/customer_${DEPLOYMENT_ID}"
          if [[ ! -d "$WORKSPACE_DIR" ]]; then
            WORKSPACE_DIR="$(find artifact -maxdepth 2 -type d -name 'customer_*' | head -1)"
          fi
          echo "WORKSPACE_DIR=$WORKSPACE_DIR" >> "$GITHUB_ENV"
          echo "Using workspace: $WORKSPACE_DIR"
          test -f "$WORKSPACE_DIR/deployment_summary.json"

      - name: Set up SSH key
        env:
          SSH_KEY_SECRET: ${{ steps.vm.outputs.SSH_KEY_SECRET }}
        run: |
          if [[ -z "$SSH_KEY_SECRET" ]]; then
            echo "No SSH key secret configured; skipping VM deployment."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s' "${!SSH_KEY_SECRET}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "SSH_READY=true" >> "$GITHUB_ENV"

      - name: Transfer workspace to VM
        if: env.SSH_READY == 'true'
        env:
          VM_HOST: ${{ steps.vm.outputs.VM_HOST }}
          VM_SSH_USER: ${{ steps.vm.outputs.VM_SSH_USER }}
          VM_SSH_PORT: ${{ steps.vm.outputs.VM_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ -n "$VM_HOST" ]] || { echo "vm_host missing in deployment_config"; exit 1; }
          REMOTE_DIR="/opt/systemaops/${DEPLOYMENT_ID}"
          ssh -i ~/.ssh/id_deploy -p "$VM_SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${VM_SSH_USER}@${VM_HOST}" "sudo mkdir -p '$REMOTE_DIR' && sudo chown \$(id -u):\$(id -g) '$REMOTE_DIR'"
          scp -P "$VM_SSH_PORT" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            -r "$WORKSPACE_DIR/." "${VM_SSH_USER}@${VM_HOST}:$REMOTE_DIR/"
          scp -P "$VM_SSH_PORT" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            scripts/deploy/remote_deploy.sh "${VM_SSH_USER}@${VM_HOST}:/tmp/remote_deploy.sh"

      - name: Run remote deployment
        if: env.SSH_READY == 'true'
        env:
          VM_HOST: ${{ steps.vm.outputs.VM_HOST }}
          VM_SSH_USER: ${{ steps.vm.outputs.VM_SSH_USER }}
          VM_SSH_PORT: ${{ steps.vm.outputs.VM_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/opt/systemaops/${DEPLOYMENT_ID}"
          ssh -i ~/.ssh/id_deploy -p "$VM_SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${VM_SSH_USER}@${VM_HOST}" \
            "bash /tmp/remote_deploy.sh '$REMOTE_DIR'"
