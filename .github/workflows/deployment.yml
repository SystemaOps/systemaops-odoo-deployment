name: SystemaOps Odoo Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Unique deployment identifier"
        required: true
        type: string
      deployment_config:
        description: "JSON string with all customer deployment parameters"
        required: true
        type: string
      admin_password:
        description: "Customer-chosen Odoo 'admin' login password (masked)."
        required: false
        type: password

env:
  DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}

jobs:
  prepare:
    name: Prepare Deployment Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse Deployment Configuration
        env:
          DEPLOYMENT_CONFIG: ${{ github.event.inputs.deployment_config }}
        run: python3 scripts/prepare/parse_config.py

      - name: Create Customer Workspace
        run: python3 scripts/prepare/create_workspace.py

      - name: Write Branding Assets
        run: python3 scripts/prepare/write_branding_assets.py

      - name: Update Configuration Files
        env:
          DEPLOYMENT_ADMIN_PASSWORD: ${{ github.event.inputs.admin_password }}
        run: python3 scripts/prepare/update_configs.py

      - name: Validate Selected Modules
        run: python3 scripts/prepare/validate_modules.py

      - name: Generate Deployment Metadata
        run: python3 scripts/prepare/generate_metadata.py

      - name: Package Deployment
        run: python3 scripts/prepare/package_deployment.py

      - uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.event.inputs.deployment_id }}
          path: deployments/customer_${{ github.event.inputs.deployment_id }}/

  deploy:
    name: Chain to VM Deployment (Phase 2)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger deploy-to-vm workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
          DEPLOYMENT_CONFIG: ${{ github.event.inputs.deployment_config }}
          CENTRAL_REGISTER_URL: ${{ vars.CENTRAL_REGISTER_URL }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DEPLOYMENT_CONFIG="${{ github.event.inputs.deployment_config }}"
          if [[ -z "$DEPLOYMENT_CONFIG" ]]; then
            echo "No deployment_config provided; skipping Phase 2."
            exit 0
          fi
          
          # Use GitHub REST API directly instead of gh CLI for reliability
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-to-vm.yml/dispatches"
          
          # Build payload using jq for proper JSON escaping
          cat > /tmp/payload.json <<EOF
{
  "ref": "${{ github.ref_name }}",
  "inputs": {
    "deployment_id": "${{ github.event.inputs.deployment_id }}",
    "deployment_config": $(echo "${{ github.event.inputs.deployment_config }}" | jq -Rs .),
    "source_run_id": "${{ github.run_id }}",
    "central_register_url": "${{ vars.CENTRAL_REGISTER_URL }}"
  }
}
EOF
          
          echo "Triggering deploy-to-vm workflow..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-to-vm.yml/dispatches")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          if [[ "$HTTP_CODE" == "204" ]]; then
            echo "Phase 2 deploy-to-vm workflow triggered successfully."
          else
            echo "Failed to trigger Phase 2. HTTP $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi
